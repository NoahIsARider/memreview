[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memreview"
version = "0.2.0"
description = "Local-first Markdown memory with spaced-repetition review for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NoahIsARider" }]
keywords = ["memory", "llm", "agent", "spaced-repetition", "markdown", "rag", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]
mcp-server = ["mcp>=1.2"]

[project.scripts]
memreview = "memreview.cli:main"
memreview-mcp = "memreview.mcp_server:main"

[tool.setuptools]
packages = ["memreview"]
